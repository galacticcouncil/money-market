[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["../bil-vault/lib", "lib"]
# DcaDispatch's two intent encoders are imported from the sibling juicer-vault sources
allow_paths = ["../juicer-vault"]
solc_version = "0.8.22"
optimizer = true
optimizer_runs = 200
evm_version = "paris"
via_ir = true

[fuzz]
runs = 256

[lint]
lint_on_build = false
