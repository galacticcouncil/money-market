[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
# Reuse the sibling bil-vault's already-installed libs (forge-std, OZ, OZ-upgradeable)
# so this module compiles without a separate `forge install`. Vendor independently
# before audit if a clean dependency boundary is wanted.
libs = ["../bil-vault/lib"]
remappings = ["@aave/=../node_modules/@aave/"]
# the @aave remapping leaves the project root; solc may only read it from an allowed path
allow_paths = ["../node_modules"]
solc_version = "0.8.22"
optimizer = true
# The combined fee/discount vault has little EIP-170 headroom. Keep the runtime
# size regression in ProtocolFeesTest passing at these production settings.
optimizer_runs = 200
evm_version = "paris"
via_ir = true
# read access for the verity forktest harness (reads bridge/forktest/bytecode/*.bin).
fs_permissions = [{ access = "read", path = "./formal" }, { access = "read-write", path = "./formal/.stateful" }]

# iteration only, never a deployable build. own out/cache so switching profiles keeps both caches.
[profile.fast]
via_ir = false
evm_version = "london"
dynamic_test_linking = true
out = "out-fast"
cache_path = "cache-fast"
additional_compiler_profiles = [{ name = "via-ir", via_ir = true }]
# stack too deep without via-ir; forge also compiles every file importing these with via-ir
compilation_restrictions = [
    { paths = "src/JuicerYieldAccounting.sol", via_ir = true },
    { paths = "src/Harvester.sol", via_ir = true },
    { paths = "src/lib/CompoundLogic.sol", via_ir = true },
    { paths = "src/lib/SubLoopLogic.sol", via_ir = true },
    { paths = "test/DcaDispatch.t.sol", via_ir = true },
]

[invariant]
runs = 256
depth = 50
fail_on_revert = false
shrink_run_limit = 0

[rpc_endpoints]
hydration = "${RPC_HYDRATION}"
lark = "https://2.lark.hydration.cloud"
