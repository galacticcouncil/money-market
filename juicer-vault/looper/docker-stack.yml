# Juicer Looper — Docker Swarm stack
#
# Drives the SubLoop ramp: each cycle calls the permissionless `pokeBorrow()`
# to lever one tranche toward target HF, then idles once at target. This is the
# off-chain loop that replaced the pallet-DCA gradual deploy.
#
# Deploy:
#   docker stack deploy -c docker-stack.yml juicer-looper
#
# Env vars expected at deploy time:
#   SUBLOOP_ADDRESS       — the SubLoop UUPS proxy
#   VAULT_ADDRESSES       — comma-separated CollateralVault proxies (jETH,jtBTC…).
#                           REQUIRED for pokeSettle/rebalance/maintainPeg/harvest;
#                           with it unset the bot only ever ramps. The lark-2 stack
#                           set this while the code read `VAULT_ADDRESS`, so every
#                           vault-level op was silently skipped for months.
#   JUICER_ROUNDING_RESERVES - per-vault JSON base-unit minimum/target policy
#   HARVESTER_ADDRESS     — Harvester; harvest is skipped when unset
#   LOOPER_PRIVATE_KEY    — signer key. Maintenance is PERMISSIONLESS (gas only);
#                           DEPOSIT_GUARDIAN_ROLE lets it set the vaults' deficitStop,
#                           the loop's KEEPER_ROLE lets it quote its intents.
#   RPC_URL               — Hydration RPC (defaults below)
#   POOL_ADDRESS          — aave main-market pool (for leverage logging)
#   POLL_INTERVAL_MS      — cycle interval, default 30s
#   MAX_TX_GAS            — gas budget per transaction, default 16777216
#   RAMP_HF_BUFFER        — idle once HF ≤ target·(1+buffer), default 0.005
#   SLOW_EVERY            — settlement/rebalance cadence in cycles, default 10
#   ALERT_WEBHOOK         — reserved legacy setting; alerts currently go to logs
#   IMAGE                 — override image (defaults to galacticcouncil/juicer-looper:latest)
#
# Keep one replica per signer. Run redundant operators as separate stacks with
# distinct keys, RPC infrastructure and OPERATOR_INDEX values. stop-first avoids
# overlapping processes on the same signer during updates.

version: "3.8"

services:
  looper:
    image: ${IMAGE:-galacticcouncil/juicer-looper:latest}
    environment:
      RPC_URL: ${RPC_URL:-https://hdx.tarn.hydration.cloud}
      RPC_URLS: ${RPC_URLS:-}
      EXECUTION_CONTROLLER: ${EXECUTION_CONTROLLER:?EXECUTION_CONTROLLER required}
      GAS_ASSET_ADDRESS: ${GAS_ASSET_ADDRESS:-}
      SPONSORED_GAS: ${SPONSORED_GAS:-true}
      SUBLOOP_ADDRESS: ${SUBLOOP_ADDRESS:?SUBLOOP_ADDRESS required}
      VAULT_ADDRESSES: ${VAULT_ADDRESSES:?VAULT_ADDRESSES required (comma-separated)}
      JUICER_ROUNDING_RESERVES: ${JUICER_ROUNDING_RESERVES:?JUICER_ROUNDING_RESERVES required}
      HARVESTER_ADDRESS: ${HARVESTER_ADDRESS:-}
      LOOPER_PRIVATE_KEY: ${LOOPER_PRIVATE_KEY:?LOOPER_PRIVATE_KEY required}
      POOL_ADDRESS: ${POOL_ADDRESS:-0x1b02E051683b5cfaC5929C25E84adb26ECf87B38}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-30000}
      SAFETY_INTERVAL_MS: ${SAFETY_INTERVAL_MS:-30000}
      OPERATOR_COUNT: ${OPERATOR_COUNT:-2}
      OPERATOR_INDEX: ${OPERATOR_INDEX:?OPERATOR_INDEX required and unique per operator}
      OPERATOR_SLOT_SECONDS: ${OPERATOR_SLOT_SECONDS:-60}
      HARVEST_MIN_USD8: ${HARVEST_MIN_USD8:-100000000}
      HARVEST_MAX_GAS_BPS: ${HARVEST_MAX_GAS_BPS:-10}
      HARVEST_MAX_DELAY_SECONDS: ${HARVEST_MAX_DELAY_SECONDS:-86400}
      MAIN_INTEREST_URGENT_USD8: ${MAIN_INTEREST_URGENT_USD8:-1000000000}
      QUOTE_TTL_SECONDS: ${QUOTE_TTL_SECONDS:-60}
      QUOTE_DRIFT_BPS: ${QUOTE_DRIFT_BPS:-2}
      QUOTE_DEPTH_BLOCKS: ${QUOTE_DEPTH_BLOCKS:-3}
      QUOTE_SIZE_STEPS: ${QUOTE_SIZE_STEPS:-6}
      SLICE_PRICE_TOLERANCE_BPS: ${SLICE_PRICE_TOLERANCE_BPS:-1}
      MAX_TX_GAS: ${MAX_TX_GAS:-16777216}
      RAMP_HF_BUFFER: ${RAMP_HF_BUFFER:-0.005}
      SLOW_EVERY: ${SLOW_EVERY:-10}
      DEFICIT_STOP_BPS: ${DEFICIT_STOP_BPS:-50}
      DEFICIT_RESUME_BPS: ${DEFICIT_RESUME_BPS:-25}
      SYNC_EVERY: ${SYNC_EVERY:-3600}
      ICE_STALL_BLOCKS: ${ICE_STALL_BLOCKS:-10}
      ICE_CLEANUP_BLOCKS: ${ICE_CLEANUP_BLOCKS:-10}
      ICE_QUOTE_HOLDER: ${ICE_QUOTE_HOLDER:-}
      SUBSTRATE_RPC_URL: ${SUBSTRATE_RPC_URL:-}
      # dev derivation only (//Name), never a real secret; empty means expired intents only alert
      ICE_CLEANUP_SURI: ${ICE_CLEANUP_SURI:-}
      ALERT_WEBHOOK: ${ALERT_WEBHOOK:-}
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 0          # unbounded restarts — looper must always come back
        window: 60s
      update_config:
        parallelism: 1
        order: stop-first        # avoid nonce overlap with the outgoing task
        delay: 5s
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
      resources:
        limits:
          cpus: "0.5"
          # the substrate api for intent dry runs adds ~300M
          memory: 768M
        reservations:
          cpus: "0.05"
          memory: 64M
      labels:
        com.hydration.role: "juicer-looper"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
