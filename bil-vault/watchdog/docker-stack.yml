# BIL Vault Watchdog — Docker Swarm stack
#
# read-only monitor, independent of the keeper: no signing key, alerts discord when
#   - an opted-in settled redemption stays unclaimed past CLAIM_GRACE_MINUTES
#     (only if the keeper holds CLAIM_OPERATOR_ROLE; auto-claim is optional)
#   - a matured position stays Active past MATURED_GRACE_MINUTES (keeper not poking)
#   - Decentral allows a position's next step but the keeper hasn't taken it within CLAIM_GRACE_MINUTES
#   - any position sits STUCK_THRESHOLD_HOURS past maturity on the keeper's side (also fires if the keeper is dead)
#   - Decentral approval waits never alert per position: at most one digest per DIGEST_HOURS, and only when
#     something has waited over DIGEST_MIN_WAIT_HOURS (no slow waits → no message); overdue past APPROVAL_SLA_HOURS
#   - keeper gas (WETH) < MIN_KEEPER_WETH, vault paused, or the watchdog itself can't read the chain
# alerts dedupe per issue, re-fire every REALERT_HOURS, and post a "resolved" when cleared.
# serves a status page on :PORT (/), json at /api/status, liveness at /healthz. route it via your proxy.
#
# Deploy:
#   docker stack deploy -c docker-stack.yml bil-watchdog

version: "3.8"

services:
  watchdog:
    image: ${IMAGE:-galacticcouncil/bil-watchdog:latest}
    environment:
      RPC_URL: ${RPC_URL:-https://rpc.hydradx.cloud}
      VAULT_ADDRESS: ${VAULT_ADDRESS:?VAULT_ADDRESS required}
      KEEPER_ADDRESS: ${KEEPER_ADDRESS:-}
      ALERT_WEBHOOK: ${ALERT_WEBHOOK:?ALERT_WEBHOOK required}
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-60000}
      CLAIM_GRACE_MINUTES: ${CLAIM_GRACE_MINUTES:-10}
      MATURED_GRACE_MINUTES: ${MATURED_GRACE_MINUTES:-60}
      STUCK_THRESHOLD_HOURS: ${STUCK_THRESHOLD_HOURS:-96}
      DIGEST_HOURS: ${DIGEST_HOURS:-24}
      DIGEST_MIN_WAIT_HOURS: ${DIGEST_MIN_WAIT_HOURS:-24}
      APPROVAL_SLA_HOURS: ${APPROVAL_SLA_HOURS:-48}
      REALERT_HOURS: ${REALERT_HOURS:-6}
      MIN_KEEPER_WETH: ${MIN_KEEPER_WETH:-0.001}
      PORT: ${PORT:-8080}
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 0
        window: 60s
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.02"
          memory: 48M
      labels:
        com.hydration.role: "bil-watchdog"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
